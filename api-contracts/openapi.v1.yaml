openapi: 3.1.0
info:
  title: OneCounter API Contracts
  version: 1.0.0
  description: API contracts for OneCounter frontend modules and integrations.
servers:
  - url: https://immam21-imiqx-mpos.vercel.app
    description: Local mock server
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Dashboard
  - name: POS
  - name: Orders
  - name: Inventory
  - name: Customers
  - name: Promotions
  - name: Reports
  - name: Integrations
  - name: Business
  - name: Storefront
paths:
  /v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login using email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: Auth tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
  /v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRefreshRequest'
      responses:
        '200':
          description: New auth tokens issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
      responses:
        '204':
          description: Logged out

  /v1/reports/dashboard:
    get:
      tags: [Dashboard]
      summary: Dashboard KPI summary and operational alerts
      responses:
        '200':
          description: Dashboard metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'

  /v1/pos/sales:
    post:
      tags: [POS]
      summary: Create POS sale transaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PosSaleCreateRequest'
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PosSaleCreateResponse'

  /v1/orders:
    get:
      tags: [Orders]
      summary: List orders for unified fulfillment queue
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
        - in: query
          name: status
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Orders list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrdersListResponse'

  /v1/orders/void:
    post:
      tags: [Orders]
      summary: Void an order with mandatory reason and audit trail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderVoidRequest'
      responses:
        '200':
          description: Order voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderVoidResponse'

  /v1/orders/reprint:
    post:
      tags: [Orders]
      summary: Request reprint of order receipt/invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderReprintRequest'
      responses:
        '200':
          description: Reprint queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderReprintResponse'

  /v1/inventory/products:
    get:
      tags: [Inventory]
      summary: List inventory products
      parameters:
        - in: query
          name: warehouse_id
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Product inventory list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryProductsResponse'

  /v1/inventory/ledger:
    get:
      tags: [Inventory]
      summary: Stock ledger entries for in/out movements
      responses:
        '200':
          description: Stock ledger
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryLedgerResponse'

  /v1/inventory/labels/print:
    post:
      tags: [Inventory]
      summary: Generate barcode label print batch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelPrintRequest'
      responses:
        '202':
          description: Label print job queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelPrintResponse'

  /v1/customers:
    get:
      tags: [Customers]
      summary: List customers and segments
      parameters:
        - in: query
          name: segment
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomersListResponse'

  /v1/promotions/campaigns:
    get:
      tags: [Promotions]
      summary: List campaigns and campaign analytics summary
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignsListResponse'

  /v1/reports/tax-summary:
    get:
      tags: [Reports]
      summary: GST tax summary report
      parameters:
        - in: query
          name: period
          required: false
          schema:
            type: string
            description: YYYY-MM
      responses:
        '200':
          description: Tax summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxSummaryResponse'

  /v1/reports/top-products:
    get:
      tags: [Reports]
      summary: Top products by units sold and revenue
      responses:
        '200':
          description: Top products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopProductsResponse'

  /v1/reports/reconciliation:
    get:
      tags: [Reports]
      summary: Payment reconciliation snapshot (UPI/Card vs POS)
      responses:
        '200':
          description: Reconciliation rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResponse'

  /v1/integrations/status:
    get:
      tags: [Integrations]
      summary: Integration health and sync status
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsStatusResponse'

  /v1/integrations/whatsapp/events:
    get:
      tags: [Integrations]
      summary: WhatsApp automation event log
      responses:
        '200':
          description: WhatsApp events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppEventsResponse'

  /v1/integrations/whatsapp/send-receipt:
    post:
      tags: [Integrations]
      summary: Send transactional receipt through WhatsApp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhatsAppSendReceiptRequest'
      responses:
        '202':
          description: Receipt send queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppSendReceiptResponse'

  /v1/business/setup:
    get:
      tags: [Business]
      summary: Business GST and setup profile
      responses:
        '200':
          description: Business setup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSetupResponse'

  /v1/storefront/placeholder:
    get:
      tags: [Storefront]
      summary: Online storefront placeholder status and counters
      responses:
        '200':
          description: Storefront placeholder summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorefrontPlaceholderResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    AuthLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    AuthRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthLogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    AuthUser:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string

    AuthTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, refresh_token, user]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [bearer]
        expires_in:
          type: integer
          description: Lifetime in seconds
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    DashboardKpis:
      type: object
      required: [revenue_today, orders_today, aov, low_stock_skus, failed_sync_alerts]
      properties:
        revenue_today: { type: number }
        orders_today: { type: integer }
        aov: { type: number }
        low_stock_skus: { type: integer }
        failed_sync_alerts: { type: integer }

    DashboardResponse:
      type: object
      required: [kpis, trend, alerts]
      properties:
        kpis:
          $ref: '#/components/schemas/DashboardKpis'
        trend:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              oneOf:
                - type: string
                - type: number
        alerts:
          type: array
          items:
            type: string

    PosSaleLine:
      type: object
      required: [name, sku, quantity, unit_price, line_total]
      properties:
        name: { type: string }
        sku: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
        line_total: { type: number }

    PosPayment:
      type: object
      required: [mode, amount]
      properties:
        mode:
          type: string
          enum: [cash, upi, card, wallet]
        amount: { type: number }

    PosTotals:
      type: object
      required: [subtotal, tax_amount, discount_amount, total_amount]
      properties:
        subtotal: { type: number }
        tax_amount: { type: number }
        discount_amount: { type: number }
        total_amount: { type: number }

    PosSaleCreateRequest:
      type: object
      required: [store_id, business_id, channel, customer, status, items, totals, payments]
      properties:
        store_id: { type: string }
        business_id: { type: string }
        channel: { type: string, enum: [in_store, online] }
        customer:
          type: object
          properties:
            id: { type: [string, 'null'] }
            name: { type: string }
        status:
          type: string
          enum: [created, paid, packed, shipped, delivered, returned]
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PosSaleLine'
        totals:
          $ref: '#/components/schemas/PosTotals'
        payments:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/PosPayment'
        metadata:
          type: object
          additionalProperties: true

    PosSaleCreateResponse:
      type: object
      required: [sale_id, status]
      properties:
        sale_id: { type: string }
        status: { type: string, enum: [accepted] }

    OrderItem:
      type: object
      required: [order_no, channel, customer_name, total_amount, status]
      properties:
        order_no: { type: string }
        channel: { type: string }
        customer_name: { type: string }
        total_amount: { type: number }
        status:
          type: string
          enum: [Created, Paid, Packed, Shipped, Delivered, Returned, Voided]

    OrderVoidRequest:
      type: object
      required: [order_no, reason]
      properties:
        order_no: { type: string }
        reason: { type: string, minLength: 2 }

    OrderVoidResponse:
      type: object
      required: [status, order_no]
      properties:
        status: { type: string, enum: [voided] }
        order_no: { type: string }

    OrderReprintRequest:
      type: object
      required: [order_no]
      properties:
        order_no: { type: string }

    OrderReprintResponse:
      type: object
      required: [status, order_no]
      properties:
        status: { type: string, enum: [queued] }
        order_no: { type: string }

    OrdersListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        next_cursor:
          type: [string, 'null']

    InventoryProduct:
      type: object
      required: [sku, name, qty, reorder_level]
      properties:
        sku: { type: string }
        name: { type: string }
        qty: { type: number }
        reorder_level: { type: number }
        location: { type: string }

    InventoryProductsResponse:
      type: object
      required: [products]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/InventoryProduct'

    InventoryLedgerEntry:
      type: object
      required: [timestamp, sku, direction, qty, source, reference_id, store_id]
      properties:
        timestamp: { type: string, format: date-time }
        sku: { type: string }
        direction: { type: string, enum: [in, out] }
        qty: { type: number }
        source: { type: string }
        reference_id: { type: string }
        store_id: { type: string }

    InventoryLedgerResponse:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/InventoryLedgerEntry'

    LabelPrintRequest:
      type: object
      required: [start_sku, copies]
      properties:
        start_sku: { type: string }
        end_sku: { type: string }
        copies: { type: integer, minimum: 1, maximum: 20 }

    LabelPrintResponse:
      type: object
      required: [job_id, status, copies]
      properties:
        job_id: { type: string }
        start_sku: { type: string }
        end_sku: { type: string }
        copies: { type: integer }
        status: { type: string, enum: [queued] }

    CustomerItem:
      type: object
      required: [id, name, segment]
      properties:
        id: { type: string }
        name: { type: string }
        segment: { type: string }

    CustomersListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CustomerItem'

    CampaignItem:
      type: object
      required: [id, name, delivered, converted]
      properties:
        id: { type: string }
        name: { type: string }
        delivered: { type: integer }
        converted: { type: integer }

    CampaignsListResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CampaignItem'

    TaxSummaryResponse:
      type: object
      required: [period, taxable_value, cgst, sgst, igst]
      properties:
        period: { type: string }
        taxable_value: { type: number }
        cgst: { type: number }
        sgst: { type: number }
        igst: { type: number }

    TopProductItem:
      type: object
      required: [sku, name, units_sold, revenue]
      properties:
        sku: { type: string }
        name: { type: string }
        units_sold: { type: number }
        revenue: { type: number }

    TopProductsResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TopProductItem'

    ReconciliationRow:
      type: object
      required: [date, gateway_amount, pos_amount, variance]
      properties:
        date: { type: string }
        gateway_amount: { type: number }
        pos_amount: { type: number }
        variance: { type: number }

    ReconciliationResponse:
      type: object
      required: [rows]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationRow'

    IntegrationsStatusResponse:
      type: object
      required:
        - whatsapp_status
        - whatsapp_templates
        - whatsapp_delivery_success
        - sheet_name
        - sheet_schedule
        - sheet_last_run
        - webhook_retries
        - idempotency_conflicts
        - failed_signatures
      properties:
        whatsapp_status: { type: string }
        whatsapp_templates: { type: integer }
        whatsapp_delivery_success: { type: string }
        sheet_name: { type: string }
        sheet_schedule: { type: string }
        sheet_last_run: { type: string }
        webhook_retries: { type: integer }
        idempotency_conflicts: { type: integer }
        failed_signatures: { type: integer }

    WhatsAppEvent:
      type: object
      required: [timestamp, type, reference_id, status]
      properties:
        timestamp: { type: string, format: date-time }
        type: { type: string }
        reference_id: { type: string }
        status: { type: string, enum: [sent, failed, queued] }

    WhatsAppEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/WhatsAppEvent'

    WhatsAppSendReceiptRequest:
      type: object
      required: [phone, reference_id, template]
      properties:
        phone: { type: string }
        reference_id: { type: string }
        template: { type: string }

    WhatsAppSendReceiptResponse:
      type: object
      required: [status, event]
      properties:
        status: { type: string, enum: [queued] }
        event:
          $ref: '#/components/schemas/WhatsAppEvent'

    BusinessSetupResponse:
      type: object
      required: [business_name, gstin, invoice_prefix]
      properties:
        business_name: { type: string }
        gstin: { type: string }
        invoice_prefix: { type: string }

    StorefrontPlaceholderResponse:
      type: object
      required: [notice, published_skus, pending_orders, sync_lag_seconds]
      properties:
        notice: { type: string }
        published_skus: { type: integer }
        pending_orders: { type: integer }
        sync_lag_seconds: { type: integer }
