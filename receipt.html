<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>E-Bill</title>
<meta name="theme-color" content="#2563EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OneCounter" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root { --brand:#1d4ed8; --line:#e2e8f0; --muted:#64748b; --txt:#0f172a; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Inter, system-ui, sans-serif;
    color: var(--txt);
    background: #f1f5f9;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .receipt {
    width: min(420px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
    padding: 18px;
  }
  .biz { text-align: center; }
  .biz h1 { margin: 0; font-size: 20px; }
  .biz p { margin: 3px 0; font-size: 12px; color: var(--muted); }
  .meta { margin: 14px 0; font-size: 12px; display: grid; gap: 4px; }
  .meta div { display: flex; justify-content: space-between; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:last-child, td:last-child, th:nth-child(2), td:nth-child(2), th:nth-child(3), td:nth-child(3) { text-align: right; }
  .totals { margin-top: 10px; font-size: 13px; display: grid; gap: 4px; }
  .totals div { display: flex; justify-content: space-between; }
  .grand { font-weight: 700; font-size: 16px; border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 6px; }
  .foot { text-align: center; margin-top: 16px; font-size: 12px; color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .referral { margin-top: 14px; padding: 12px; border: 1px dashed var(--brand); border-radius: 10px; background:#eff6ff; text-align:center; display:grid; gap:4px; }
  .referral > span:first-child { font-size:12px; color: var(--muted); }
  .referral .code { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: var(--brand); }
  .referral small { font-size: 11px; color: var(--muted); }
  .tracking { margin-top: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background:#f8fafc; display:grid; gap:6px; }
  .tracking > span:first-child { font-size: 12px; font-weight: 700; color: var(--txt); }
  .tracking .tk { display:flex; justify-content:space-between; font-size: 13px; }
  .tracking small { font-size: 12px; color: var(--muted); }
  .state { text-align: center; padding: 40px 10px; color: var(--muted); }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#dcfce7; color:#166534; font-size:11px; font-weight:600; text-transform:capitalize; }
</style>
</head>
<body>
  <div class="receipt" id="receipt">
    <div class="state" id="state">Loading your e-bill…</div>
  </div>

<script src="config.js"></script>
<script>if(["localhost","127.0.0.1"].indexOf(location.hostname)!==-1){document.write('<scr'+'ipt src="config.local.js"><\/scr'+'ipt>');}</script>
<script src="pwa.js"></script>
<script>
  const API_BASE = window.__ONECOUNTER_API_BASE_URL__ || "http://localhost:8787";
  const money = (n) => "\u20B9" + Number(n || 0).toLocaleString("en-IN");

  function splitGst(totals) {
    const tax = Number(totals.tax || 0);
    const cgst = Math.round(tax * 50) / 100;
    const rate = Number(totals.subtotal || 0) > 0 && tax > 0 ? ` (${Math.round((tax / totals.subtotal * 50) * 100) / 100}%)` : "";
    return { cgst, sgst: Math.round((tax - cgst) * 100) / 100, rate };
  }

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  function render(data) {
    const b = data.business || {};
    const s = data.store || {};
    const m = data.membership || {};
    const tk = data.tracking || {};
    const isManual = data.channel === "online" || String(data.sale_id || "").toUpperCase().startsWith("ONLINE");
    const showTracking = isManual;
    const addr = [s.name, s.address_line, [s.city, s.state, s.pincode].filter(Boolean).join(" ")].filter(Boolean);
    const rows = (data.items || []).map((it) =>
      `<tr><td>${it.name || it.sku}</td><td>${it.quantity}</td><td>${money(it.unit_price)}</td><td>${money(it.line_total)}</td></tr>`
    ).join("");
    const gst = splitGst(data.totals);
    document.getElementById("receipt").innerHTML = `
      <div class="biz">
        <h1>${b.name || "Tax Invoice"}</h1>
        ${addr.map((l) => `<p>${l}</p>`).join("")}
        ${b.gstin ? `<p>GSTIN: ${b.gstin}</p>` : ""}
      </div>
      <div class="meta">
        <div><span>Bill No</span><span class="mono">${data.sale_id}</span></div>
        <div><span>Date</span><span>${new Date(data.created_at).toLocaleString()}</span></div>
        <div><span>Customer</span><span>${data.customer_name || "-"}</span></div>
        <div><span>Status</span><span class="badge">${data.status || "paid"}</span></div>
      </div>
      <table>
        <thead><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="4">No items</td></tr>`}</tbody>
      </table>
      <div class="totals">
        <div><span>Subtotal</span><span>${money(data.totals.subtotal)}</span></div>
        <div><span>CGST${gst.rate}</span><span>${money(gst.cgst)}</span></div>
        <div><span>SGST${gst.rate}</span><span>${money(gst.sgst)}</span></div>
        ${data.totals.discount ? `<div><span>Discount</span><span>-${money(data.totals.discount)}</span></div>` : ""}
        ${isManual && data.totals.shipping ? `<div><span>Shipping</span><span>${money(data.totals.shipping)}</span></div>` : ""}
        <div class="grand"><span>Total</span><span>${money(data.totals.total)}</span></div>
        ${m.reward_earned ? `<div><span>Reward points earned</span><span>+${money(m.reward_earned)}</span></div>` : ""}
        <div><span>Reward wallet balance</span><span>${money(m.wallet_balance != null ? m.wallet_balance : data.totals.wallet_balance)}</span></div>
      </div>
      ${showTracking ? `<div class="tracking"><span>Shipment tracking</span>${tk.tracking_number ? `<div class="tk"><span>Courier</span><b>${tk.courier || "-"}</b></div><div class="tk"><span>Tracking no.</span><b class="mono">${tk.tracking_number}</b></div>` : `<small>Tracking will be updated soon.</small>`}</div>` : ""}
      ${m.referral_code ? `<div class="referral"><span>Your referral code</span><span class="mono code">${m.referral_code}</span><small>Share it — you and your friend both earn rewards.</small></div>` : ""}
      <div class="foot">
        Paid via ${(data.payment_modes || ["cash"]).join(", ").toUpperCase()}<br/>
        <a href="wallet.html" style="color:var(--brand);text-decoration:none;font-weight:600;">Check my rewards wallet →</a><br/>
        Thank you for shopping with us!
      </div>
    `;
  }

  (async function load() {
    const id = getParam("id");
    if (!id) {
      document.getElementById("state").textContent = "Invalid bill link.";
      return;
    }
    try {
      const res = await fetch(`${API_BASE}/v1/receipt?id=${encodeURIComponent(id)}`);
      if (!res.ok) {
        throw new Error("not found");
      }
      render(await res.json());
    } catch (_) {
      document.getElementById("state").textContent = "E-bill not found or unavailable.";
    }
  })();

  OneCounterPWA.init();
</script>
</body>
</html>
