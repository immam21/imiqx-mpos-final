<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Wallet</title>
<meta name="theme-color" content="#2563EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OneCounter" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root { --brand:#1d4ed8; --line:#e2e8f0; --muted:#64748b; --txt:#0f172a; --good:#166534; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Inter, system-ui, sans-serif;
    color: var(--txt);
    background: #f1f5f9;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: min(420px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
    padding: 18px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; text-align: center; }
  .sub { margin: 0 0 16px; font-size: 12px; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--brand); }
  button {
    padding: 12px 16px; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--brand); border: none; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .state { text-align: center; padding: 24px 10px; color: var(--muted); font-size: 13px; }
  .balance { text-align: center; margin: 18px 0 8px; }
  .balance .amt { font-size: 34px; font-weight: 800; color: var(--brand); }
  .balance .lbl { font-size: 12px; color: var(--muted); }
  .meta { margin: 12px 0; font-size: 13px; display: grid; gap: 6px; }
  .meta div { display: flex; justify-content: space-between; }
  .code { border: 1px dashed var(--brand); border-radius: 10px; background:#eff6ff; text-align:center; padding: 12px; margin: 12px 0; display:grid; gap:4px; }
  .code .val { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--brand); }
  .code small { font-size: 11px; color: var(--muted); }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:last-child, td:last-child { text-align: right; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .credit { color: var(--good); }
  .debit { color: #b91c1c; }
  .share { margin: 6px 0 4px; }
  .share h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 8px; text-align: center; }
  .share-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .share-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 11px; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; color: #fff; cursor: pointer; }
  .share-btn svg { width: 18px; height: 18px; fill: currentColor; }
  .share-wa { background: #25D366; }
  .share-ig { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .share-wide { grid-column: span 2; background: #0f766e; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #0f172a; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 50; max-width: 90%; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="card">
    <h1>My Rewards Wallet</h1>
    <p class="sub">Enter your mobile number to check your balance and referral code.</p>
    <div class="row">
      <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" />
      <button id="check" type="button">Check</button>
    </div>
    <div id="result"></div>
  </div>
  <div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>if(["localhost","127.0.0.1"].indexOf(location.hostname)!==-1){document.write('<scr'+'ipt src="config.local.js"><\/scr'+'ipt>');}</script>
<script src="pwa.js"></script>
<script>
  const API_BASE = window.__ONECOUNTER_API_BASE_URL__ || "http://localhost:8787";
  const money = (n) => "\u20B9" + Number(n || 0).toLocaleString("en-IN");
  const TXN_LABELS = {
    purchase_reward: "Purchase reward",
    referral_reward: "Referral reward",
    wallet_redemption: "Redeemed",
    expiry_adjustment: "Expired",
    exclusive_joining_credit: "Joining credit"
  };

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  let SHARE = { message: "" };
  const WA_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M.057 24l1.687-6.163a11.867 11.867 0 01-1.587-5.946C.16 5.335 5.495 0 12.05 0a11.82 11.82 0 018.413 3.488 11.82 11.82 0 013.48 8.414c-.003 6.557-5.338 11.892-11.893 11.892a11.9 11.9 0 01-5.688-1.448L.057 24zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884a9.86 9.86 0 001.51 5.26l-.999 3.648 3.978-1.607zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.767.967-.94 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>';
  const IG_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>';

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
  }

  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve) => {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (_) { /* ignore */ }
      document.body.removeChild(ta);
      resolve();
    });
  }

  function buildShareMessage(businessName, code) {
    const brand = businessName || "Ennaval";
    return `🎉 Shop at ${brand} and save more!\n\n`
      + `Use my referral code: ${code}\n`
      + `Use it on your first purchase — we BOTH earn reward points 💰 to redeem on future bills.\n\n`
      + `✨ Great deals every day. Visit us here:\nhttps://ennaval-business-card.vercel.app/`;
  }

  function share(kind) {
    const msg = SHARE.message;
    if (!msg) return;
    if (kind === "whatsapp") {
      window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
    } else if (kind === "instagram") {
      copyText(msg).then(() => {
        toast("Message copied — paste it in your Instagram story or DM");
        window.open("https://www.instagram.com/", "_blank");
      });
    } else if (kind === "native") {
      if (navigator.share) {
        navigator.share({ text: msg }).catch(() => {});
      } else {
        copyText(msg).then(() => toast("Referral message copied"));
      }
    } else if (kind === "copy") {
      copyText(msg).then(() => toast("Referral message copied"));
    }
  }

  function renderMember(data) {
    const m = data.member;
    SHARE.message = m.referral_code ? buildShareMessage(data.business_name, m.referral_code) : "";
    const rows = (data.history || []).map((h) => {
      const positive = Number(h.amount || 0) >= 0;
      return `<tr>
        <td>${new Date(h.created_at).toLocaleDateString()}</td>
        <td>${TXN_LABELS[h.type] || h.type}</td>
        <td class="${positive ? "credit" : "debit"}">${positive ? "+" : ""}${money(h.amount)}</td>
      </tr>`;
    }).join("");
    const expiry = m.wallet_expires_at ? new Date(m.wallet_expires_at).toLocaleDateString() : "";
    document.getElementById("result").innerHTML = `
      <div class="balance">
        <div class="amt">${money(m.wallet_balance)}</div>
        <div class="lbl">available reward balance${expiry ? ` &middot; expires ${expiry}` : ""}</div>
      </div>
      <div class="meta">
        <div><span>Name</span><span>${m.name || "-"}</span></div>
        <div><span>Mobile</span><span class="mono">${m.phone || "-"}</span></div>
        <div><span>Membership</span><span style="text-transform:capitalize;">${m.tier || "regular"}</span></div>
        <div><span>Successful referrals</span><span class="mono">${m.successful_referral_count || 0}</span></div>
      </div>
      <div class="code">
        <span style="font-size:12px;color:var(--muted);">Your referral code</span>
        <span class="val">${m.referral_code || "-"}</span>
        <small>Share it — you and your friend both earn rewards.</small>
      </div>
      ${m.referral_code ? `<div class="share">
        <h3>Refer &amp; earn</h3>
        <div class="share-btns">
          <button class="share-btn share-wa" type="button" data-share="whatsapp">${WA_ICON} WhatsApp</button>
          <button class="share-btn share-ig" type="button" data-share="instagram">${IG_ICON} Instagram</button>
          ${navigator.share ? `<button class="share-btn share-wide" type="button" data-share="native">Share to other apps…</button>` : `<button class="share-btn share-wide" type="button" data-share="copy">Copy message</button>`}
        </div>
      </div>` : ""}
      ${rows ? `<h2>Recent activity</h2><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
    `;
  }

  async function check() {
    const raw = document.getElementById("phone").value.replace(/\D/g, "").slice(-10);
    const btn = document.getElementById("check");
    const out = document.getElementById("result");
    if (raw.length !== 10) {
      out.innerHTML = `<div class="state">Please enter a valid 10-digit mobile number.</div>`;
      return;
    }
    btn.disabled = true;
    out.innerHTML = `<div class="state">Checking…</div>`;
    try {
      const res = await fetch(`${API_BASE}/v1/wallet?phone=${encodeURIComponent(raw)}`);
      const data = await res.json();
      if (!data.found) {
        out.innerHTML = `<div class="state">No rewards account found for this number.<br/>Make a purchase to start earning.</div>`;
        return;
      }
      renderMember(data);
    } catch (_) {
      out.innerHTML = `<div class="state">Unable to check right now. Please try again.</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("check").addEventListener("click", check);
  document.getElementById("phone").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });
  document.getElementById("result").addEventListener("click", (e) => {
    const btn = e.target.closest("[data-share]");
    if (btn) share(btn.getAttribute("data-share"));
  });

  const preset = getParam("phone");
  if (preset) {
    document.getElementById("phone").value = preset.replace(/\D/g, "").slice(-10);
    check();
  }

  OneCounterPWA.init();
</script>
</body>
</html>
