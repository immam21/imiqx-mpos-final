<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>My Wallet</title>
<meta name="theme-color" content="#2563EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OneCounter" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<style>
  :root { --brand:#1d4ed8; --line:#e2e8f0; --muted:#64748b; --txt:#0f172a; --good:#166534; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Inter, system-ui, sans-serif;
    color: var(--txt);
    background: #f1f5f9;
    padding: 16px;
    display: flex;
    justify-content: center;
  }
  .card {
    width: min(420px, 100%);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: 0 10px 30px rgba(15,23,42,.08);
    padding: 18px;
  }
  h1 { margin: 0 0 4px; font-size: 20px; text-align: center; }
  .sub { margin: 0 0 16px; font-size: 12px; color: var(--muted); text-align: center; }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1; padding: 12px; font-size: 15px; border: 1px solid var(--line);
    border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--brand); }
  button {
    padding: 12px 16px; font-size: 15px; font-weight: 600; color: #fff;
    background: var(--brand); border: none; border-radius: 10px; cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
  .state { text-align: center; padding: 24px 10px; color: var(--muted); font-size: 13px; }
  .balance { text-align: center; margin: 18px 0 8px; }
  .balance .amt { font-size: 34px; font-weight: 800; color: var(--brand); }
  .balance .lbl { font-size: 12px; color: var(--muted); }
  .meta { margin: 12px 0; font-size: 13px; display: grid; gap: 6px; }
  .meta div { display: flex; justify-content: space-between; }
  .code { border: 1px dashed var(--brand); border-radius: 10px; background:#eff6ff; text-align:center; padding: 12px; margin: 12px 0; display:grid; gap:4px; }
  .code .val { font-size: 22px; font-weight: 700; letter-spacing: 2px; color: var(--brand); }
  .code small { font-size: 11px; color: var(--muted); }
  h2 { font-size: 13px; margin: 16px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
  th:last-child, td:last-child { text-align: right; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .credit { color: var(--good); }
  .debit { color: #b91c1c; }
</style>
</head>
<body>
  <div class="card">
    <h1>My Rewards Wallet</h1>
    <p class="sub">Enter your mobile number to check your balance and referral code.</p>
    <div class="row">
      <input id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" />
      <button id="check" type="button">Check</button>
    </div>
    <div id="result"></div>
  </div>

<script src="config.js"></script>
<script>if(["localhost","127.0.0.1"].indexOf(location.hostname)!==-1){document.write('<scr'+'ipt src="config.local.js"><\/scr'+'ipt>');}</script>
<script src="pwa.js"></script>
<script>
  const API_BASE = window.__ONECOUNTER_API_BASE_URL__ || "http://localhost:8787";
  const money = (n) => "\u20B9" + Number(n || 0).toLocaleString("en-IN");
  const TXN_LABELS = {
    purchase_reward: "Purchase reward",
    referral_reward: "Referral reward",
    wallet_redemption: "Redeemed",
    expiry_adjustment: "Expired",
    exclusive_joining_credit: "Joining credit"
  };

  function getParam(name) {
    return new URLSearchParams(window.location.search).get(name) || "";
  }

  function renderMember(data) {
    const m = data.member;
    const rows = (data.history || []).map((h) => {
      const positive = Number(h.amount || 0) >= 0;
      return `<tr>
        <td>${new Date(h.created_at).toLocaleDateString()}</td>
        <td>${TXN_LABELS[h.type] || h.type}</td>
        <td class="${positive ? "credit" : "debit"}">${positive ? "+" : ""}${money(h.amount)}</td>
      </tr>`;
    }).join("");
    const expiry = m.wallet_expires_at ? new Date(m.wallet_expires_at).toLocaleDateString() : "";
    document.getElementById("result").innerHTML = `
      <div class="balance">
        <div class="amt">${money(m.wallet_balance)}</div>
        <div class="lbl">available reward balance${expiry ? ` &middot; expires ${expiry}` : ""}</div>
      </div>
      <div class="meta">
        <div><span>Name</span><span>${m.name || "-"}</span></div>
        <div><span>Mobile</span><span class="mono">${m.phone || "-"}</span></div>
        <div><span>Membership</span><span style="text-transform:capitalize;">${m.tier || "regular"}</span></div>
        <div><span>Successful referrals</span><span class="mono">${m.successful_referral_count || 0}</span></div>
      </div>
      <div class="code">
        <span style="font-size:12px;color:var(--muted);">Your referral code</span>
        <span class="val">${m.referral_code || "-"}</span>
        <small>Share it — you and your friend both earn rewards.</small>
      </div>
      ${rows ? `<h2>Recent activity</h2><table><thead><tr><th>Date</th><th>Type</th><th>Amount</th></tr></thead><tbody>${rows}</tbody></table>` : ""}
    `;
  }

  async function check() {
    const raw = document.getElementById("phone").value.replace(/\D/g, "").slice(-10);
    const btn = document.getElementById("check");
    const out = document.getElementById("result");
    if (raw.length !== 10) {
      out.innerHTML = `<div class="state">Please enter a valid 10-digit mobile number.</div>`;
      return;
    }
    btn.disabled = true;
    out.innerHTML = `<div class="state">Checking…</div>`;
    try {
      const res = await fetch(`${API_BASE}/v1/wallet?phone=${encodeURIComponent(raw)}`);
      const data = await res.json();
      if (!data.found) {
        out.innerHTML = `<div class="state">No rewards account found for this number.<br/>Make a purchase to start earning.</div>`;
        return;
      }
      renderMember(data);
    } catch (_) {
      out.innerHTML = `<div class="state">Unable to check right now. Please try again.</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  document.getElementById("check").addEventListener("click", check);
  document.getElementById("phone").addEventListener("keydown", (e) => { if (e.key === "Enter") check(); });

  const preset = getParam("phone");
  if (preset) {
    document.getElementById("phone").value = preset.replace(/\D/g, "").slice(-10);
    check();
  }

  OneCounterPWA.init();
</script>
</body>
</html>
