<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OneCounter Login</title>
<meta name="theme-color" content="#2563EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OneCounter" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg-a: #eef3f8;
    --bg-b: #f3efe7;
    --card: #f6f7f8;
    --txt: #0f172a;
    --muted: #6b7280;
    --line: #d7dfeb;
    --brand: #1d4ed8;
    --brand-2: #f97316;
    --soft-blue: #eaf2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, sans-serif;
    color: var(--txt);
    background: linear-gradient(180deg, var(--bg-a), var(--bg-b));
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .shell {
    width: min(560px, 100%);
    border: 1px solid var(--line);
    border-radius: 18px;
    background: rgba(255,255,255,0.85);
    backdrop-filter: blur(4px);
    box-shadow: 0 18px 36px rgba(15, 23, 42, 0.08);
    padding: 26px 24px 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 18px;
  }
  .logo {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    color: #fff;
    font-weight: 700;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--brand), #3b82f6);
    font-size: 20px;
    line-height: 1;
    box-shadow: 0 8px 18px rgba(37, 99, 235, 0.22);
  }
  h1 {
    margin: 0;
    font-family: Calistoga, serif;
    font-size: clamp(34px, 4vw, 41px);
    font-weight: 400;
    letter-spacing: -0.05em;
    line-height: 1;
  }
  .sub {
    margin: 10px 0 0;
    color: var(--txt);
    font-size: 15px;
    font-weight: 500;
  }
  form {
    margin-top: 18px;
    display: grid;
    gap: 18px;
  }
  label {
    display: grid;
    gap: 8px;
    color: #334155;
    font-size: 14px;
    font-weight: 600;
  }
  input, select {
    border: 1px solid var(--line);
    border-radius: 12px;
    font-size: 18px;
    padding: 14px 14px;
    outline: none;
    background: rgba(255,255,255,0.55);
    color: var(--txt);
  }
  input:focus, select:focus {
    border-color: #93c5fd;
    box-shadow: 0 0 0 3px rgba(147, 197, 253, 0.25);
  }
  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #475569 50%), linear-gradient(135deg, #475569 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  button {
    border: 0;
    border-radius: 12px;
    padding: 15px 18px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    background: linear-gradient(180deg, #f97316, var(--brand-2));
    color: #111827;
    box-shadow: 0 8px 14px rgba(249, 115, 22, 0.18);
  }
  .error {
    min-height: 18px;
    color: #b91c1c;
    font-size: 12px;
    font-weight: 600;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <section class="shell" aria-label="Login form">
    <div class="brand">
      <div class="logo">1C</div>
      <div>
        <h1>OneCounter</h1>
        <p class="sub">Sign in to continue</p>
      </div>
    </div>

    <form id="login-form">
      <label>Email
        <input id="email" type="email" required autocomplete="username" placeholder="owner@store.com" />
      </label>
      <label>Password
        <input id="password" type="password" required autocomplete="current-password" placeholder="********" />
      </label>
      <label>Store
        <select id="store">
          <option value="store-main">Coimbatore Main</option>
          <option value="store-north">Coimbatore North</option>
          <option value="store-online">Online Fulfillment</option>
        </select>
      </label>
      <button type="submit" id="submit-btn">Sign In</button>
      <div class="error" id="error"></div>
    </form>

    <details id="user-admin" style="margin-top:18px;">
      <summary style="cursor:pointer; font-weight:600; font-size:14px; color:#334155; list-style:none;">Manage Users</summary>
      <div style="margin-top:10px; display:grid; gap:10px; border:1px dashed #cbd5e1; border-radius:10px; padding:12px; background:rgba(248,250,252,0.8);">
        <div style="display:flex; gap:16px; font-size:13px; font-weight:600;">
          <label style="display:flex; flex-direction:row; align-items:center; gap:6px;"><input type="radio" name="user-mode" value="add" checked style="padding:0;" /> Add user</label>
          <label style="display:flex; flex-direction:row; align-items:center; gap:6px;"><input type="radio" name="user-mode" value="remove" style="padding:0;" /> Remove user</label>
        </div>

        <div id="add-user-fields" style="display:grid; gap:10px;">
          <label>User ID (email)
            <input id="nu-email" type="email" autocomplete="off" placeholder="user@store.com" />
          </label>
          <label>Password
            <input id="nu-password" type="password" autocomplete="new-password" placeholder="min 6 characters" />
          </label>
          <label>Role
            <select id="nu-role">
              <option value="cashier">Cashier</option>
              <option value="manager" selected>Manager</option>
              <option value="admin">Admin</option>
            </select>
          </label>
        </div>

        <div id="remove-user-fields" style="display:none; gap:10px;">
          <label>Select user
            <select id="ru-user"><option value="">Select "Remove user" to load</option></select>
          </label>
        </div>

        <label>Admin Code
          <input id="ua-code" type="password" inputmode="numeric" autocomplete="off" placeholder="Enter admin code" />
        </label>
        <label style="display:flex; flex-direction:row; align-items:center; gap:6px; font-weight:600;">
          <input id="ua-confirm" type="checkbox" style="padding:0; width:auto;" /> I confirm this action
        </label>
        <button type="button" id="ua-submit">Submit</button>
        <div class="error" id="ua-status"></div>
      </div>
    </details>
  </section>

<script src="config.js"></script>
<script>if(["localhost","127.0.0.1"].indexOf(location.hostname)!==-1){document.write('<scr'+'ipt src="config.local.js"><\/scr'+'ipt>');}</script>
<script src="pwa.js"></script>
<script>
  const AUTH_KEYS = {
    access: "onecounter_access_token",
    refresh: "onecounter_refresh_token",
    expiresAt: "onecounter_access_expires_at",
    email: "onecounter_user_email",
    sessionStart: "onecounter_session_start",
    role: "onecounter_user_role"
  };

  const APP_CONFIG = {
    apiBaseUrl: window.__ONECOUNTER_API_BASE_URL__ || "http://localhost:8787",
    supabaseUrl: window.__ONECOUNTER_SUPABASE_URL__ || "",
    supabaseAnonKey: window.__ONECOUNTER_SUPABASE_ANON_KEY__ || ""
  };

  function isSupabaseConfigured() {
    return Boolean(APP_CONFIG.supabaseUrl && APP_CONFIG.supabaseAnonKey);
  }

  async function supabasePasswordLogin(email, password) {
    const res = await fetch(`${APP_CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: APP_CONFIG.supabaseAnonKey
      },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error("Supabase login failed");
    return res.json();
  }

  async function backendAuthLogin(email, password) {
    const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || "invalid_credentials");
    }
    return res.json();
  }

  function persistSession(payload, selectedStore) {
    const expiresAtMs = Date.now() + (Number(payload.expires_in || 900) * 1000);
    localStorage.setItem(AUTH_KEYS.access, payload.access_token || "");
    localStorage.setItem(AUTH_KEYS.refresh, payload.refresh_token || "");
    localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAtMs));
    localStorage.setItem(AUTH_KEYS.email, payload.user?.email || "");
    localStorage.setItem(AUTH_KEYS.role, payload.user?.role || "manager");
    localStorage.setItem(AUTH_KEYS.sessionStart, String(Date.now()));
    localStorage.setItem("onecounter_store_id", selectedStore);
    localStorage.setItem("onecounter_role", payload.user?.role || "manager");
  }

  (function boot() {
    const existing = localStorage.getItem(AUTH_KEYS.access) || "";
    if (existing) {
      window.location.replace("index.html");
      return;
    }
  })();

  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const store = document.getElementById("store").value;
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    errorEl.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    try {
      const payload = isSupabaseConfigured()
        ? await supabasePasswordLogin(email, password)
        : await backendAuthLogin(email, password);
      if (!payload.user) payload.user = { email: email, role: "manager" };
      persistSession(payload, store);
      window.location.replace("index.html");
    } catch (err) {
      errorEl.textContent = err.message === "invalid_credentials"
        ? "Invalid email or password."
        : "Sign in failed. Check configuration and credentials.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

  // ---- User management (add/remove) ----
  const uaStatus = document.getElementById("ua-status");
  const addFields = document.getElementById("add-user-fields");
  const removeFields = document.getElementById("remove-user-fields");
  const ruUser = document.getElementById("ru-user");

  function currentUserMode() {
    const checked = document.querySelector("input[name='user-mode']:checked");
    return checked ? checked.value : "add";
  }

  async function loadUserList() {
    ruUser.innerHTML = "<option value=''>Loading...</option>";
    try {
      const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/admin/users`);
      const data = await res.json();
      const users = Array.isArray(data.users) ? data.users : [];
      if (!users.length) {
        ruUser.innerHTML = "<option value=''>No users found</option>";
        return;
      }
      ruUser.innerHTML = users
        .map((u) => `<option value="${u.id}">${u.email}${u.role ? " (" + u.role + ")" : ""}</option>`)
        .join("");
    } catch (_) {
      ruUser.innerHTML = "<option value=''>Failed to load users</option>";
    }
  }

  document.querySelectorAll("input[name='user-mode']").forEach((radio) => {
    radio.addEventListener("change", () => {
      uaStatus.textContent = "";
      uaStatus.style.color = "";
      const isAdd = currentUserMode() === "add";
      addFields.style.display = isAdd ? "grid" : "none";
      removeFields.style.display = isAdd ? "none" : "grid";
      if (!isAdd) {
        loadUserList();
      }
    });
  });

  document.getElementById("ua-submit").addEventListener("click", async () => {
    const mode = currentUserMode();
    const code = document.getElementById("ua-code").value.trim();
    const confirmed = document.getElementById("ua-confirm").checked;
    uaStatus.style.color = "#b91c1c";

    if (!code) {
      uaStatus.textContent = "Admin code is required.";
      return;
    }
    if (!confirmed) {
      uaStatus.textContent = "Please confirm the action.";
      return;
    }

    try {
      if (mode === "add") {
        const email = document.getElementById("nu-email").value.trim();
        const password = document.getElementById("nu-password").value;
        const role = document.getElementById("nu-role").value;
        if (!email || !password) {
          uaStatus.textContent = "Email and password are required.";
          return;
        }
        const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/admin/users`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ admin_code: code, email, password, role })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || data.error || "Failed to add user");
        }
        uaStatus.style.color = "#15803d";
        uaStatus.textContent = `User added: ${email}`;
        document.getElementById("nu-email").value = "";
        document.getElementById("nu-password").value = "";
      } else {
        const userId = ruUser.value;
        if (!userId) {
          uaStatus.textContent = "Select a user to remove.";
          return;
        }
        const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/admin/users/delete`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ admin_code: code, user_id: userId })
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.message || data.error || "Failed to remove user");
        }
        uaStatus.style.color = "#15803d";
        uaStatus.textContent = "User removed.";
        loadUserList();
      }
      document.getElementById("ua-code").value = "";
      document.getElementById("ua-confirm").checked = false;
    } catch (err) {
      uaStatus.style.color = "#b91c1c";
      uaStatus.textContent = err.message || "Action failed.";
    }
  });

  OneCounterPWA.init();
</script>
</body>
</html>
