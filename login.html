<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OneCounter Login</title>
<meta name="theme-color" content="#2563EB" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="OneCounter" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --card: #ffffff;
    --txt: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --brand: #2563eb;
    --brand-2: #f97316;
    --soft-blue: #eaf2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: Inter, sans-serif;
    color: var(--txt);
    background: #0b1220;
    display: grid;
    place-items: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }
  /* Ambient animated gradient backdrop */
  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(42% 42% at 18% 22%, rgba(37, 99, 235, 0.55), transparent 60%),
      radial-gradient(38% 38% at 82% 18%, rgba(249, 115, 22, 0.45), transparent 60%),
      radial-gradient(50% 50% at 50% 88%, rgba(14, 165, 233, 0.40), transparent 62%);
    filter: blur(30px);
    animation: drift 18s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    0%   { transform: translate3d(0, 0, 0) scale(1); }
    50%  { transform: translate3d(2%, -2%, 0) scale(1.06); }
    100% { transform: translate3d(-2%, 2%, 0) scale(1.02); }
  }
  .shell {
    position: relative;
    z-index: 1;
    width: min(430px, 100%);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    box-shadow: 0 30px 70px rgba(2, 6, 23, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    padding: 34px 30px 26px;
    animation: rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 12px;
    margin-bottom: 22px;
  }
  .logo {
    width: 58px;
    height: 58px;
    border-radius: 16px;
    color: #fff;
    font-weight: 700;
    display: grid;
    place-items: center;
    background: linear-gradient(145deg, var(--brand), #60a5fa);
    font-size: 24px;
    line-height: 1;
    box-shadow: 0 12px 24px rgba(37, 99, 235, 0.35);
  }
  h1 {
    margin: 0;
    font-family: Calistoga, serif;
    font-size: clamp(30px, 6vw, 38px);
    font-weight: 400;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  .sub {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }
  form {
    margin-top: 4px;
    display: grid;
    gap: 16px;
  }
  label {
    display: grid;
    gap: 7px;
    color: #334155;
    font-size: 13px;
    font-weight: 600;
  }
  .field { position: relative; }
  .field .ico {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    width: 18px;
    height: 18px;
    color: #94a3b8;
    pointer-events: none;
  }
  input, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 13px;
    font-size: 16px;
    padding: 14px 14px 14px 44px;
    outline: none;
    background: #f8fafc;
    color: var(--txt);
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }
  select { padding-left: 44px; }
  input:focus, select:focus {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.14);
  }
  select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #475569 50%), linear-gradient(135deg, #475569 50%, transparent 50%);
    background-position: calc(100% - 18px) calc(50% - 2px), calc(100% - 12px) calc(50% - 2px);
    background-size: 6px 6px, 6px 6px;
    background-repeat: no-repeat;
    padding-right: 36px;
  }
  button.primary {
    border: 0;
    border-radius: 13px;
    padding: 15px 18px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(180deg, #3b82f6, var(--brand));
    box-shadow: 0 12px 22px rgba(37, 99, 235, 0.32);
    transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
  }
  button.primary:hover { transform: translateY(-1px); box-shadow: 0 16px 28px rgba(37, 99, 235, 0.4); }
  button.primary:active { transform: translateY(0); }
  button.primary:disabled { opacity: 0.7; cursor: default; transform: none; }
  .error {
    min-height: 18px;
    color: #b91c1c;
    font-size: 12.5px;
    font-weight: 600;
    text-align: center;
  }
  .foot {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    text-align: center;
    font-size: 13px;
    color: var(--muted);
  }
  .contact-admin {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--brand);
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
  }
  .contact-admin:hover { text-decoration: underline; }
  .contact-admin svg { width: 15px; height: 15px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
</style>
</head>
<body>
  <section class="shell" aria-label="Login form">
    <div class="brand">
      <div class="logo">1C</div>
      <div>
        <h1>OneCounter</h1>
        <p class="sub">Sign in to continue</p>
      </div>
    </div>

    <form id="login-form">
      <label>Email
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input id="email" type="email" required autocomplete="username" placeholder="owner@store.com" />
        </div>
      </label>
      <label>Password
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
      </label>
      <label>Store
        <div class="field">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9 4 4h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>
          <select id="store">
            <option value="">Enter your email to load stores…</option>
          </select>
        </div>
      </label>
      <button type="submit" class="primary" id="submit-btn">Sign In</button>
      <div class="error" id="error"></div>
    </form>

    <div class="foot">
      Trouble signing in?
      <a class="contact-admin" id="contact-admin" role="button" tabindex="0">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.13h-.01a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-3.11.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.24-8.23 2.2 0 4.27.86 5.82 2.42a8.18 8.18 0 0 1 2.41 5.82c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.16.25-.64.81-.79.97-.14.17-.29.19-.54.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.72-.14-.25-.02-.38.11-.51.11-.11.25-.29.37-.43.12-.14.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.42-.56-.43-.14 0-.31-.01-.48-.01-.16 0-.43.06-.66.31-.23.25-.87.85-.87 2.07 0 1.22.89 2.4 1.01 2.56.12.17 1.75 2.67 4.23 3.74.59.26 1.05.41 1.41.52.59.19 1.13.16 1.56.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.14-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>
        Contact admin
      </a>
    </div>
  </section>

<script src="config.js"></script>
<script>if(["localhost","127.0.0.1"].indexOf(location.hostname)!==-1){document.write('<scr'+'ipt src="config.local.js"><\/scr'+'ipt>');}</script>
<script src="pwa.js"></script>
<script>
  const AUTH_KEYS = {
    access: "onecounter_access_token",
    refresh: "onecounter_refresh_token",
    expiresAt: "onecounter_access_expires_at",
    email: "onecounter_user_email",
    sessionStart: "onecounter_session_start",
    role: "onecounter_user_role"
  };

  const APP_CONFIG = {
    apiBaseUrl: window.__ONECOUNTER_API_BASE_URL__ || "http://localhost:8787",
    supabaseUrl: window.__ONECOUNTER_SUPABASE_URL__ || "",
    supabaseAnonKey: window.__ONECOUNTER_SUPABASE_ANON_KEY__ || ""
  };

  function isSupabaseConfigured() {
    return Boolean(APP_CONFIG.supabaseUrl && APP_CONFIG.supabaseAnonKey);
  }

  async function supabasePasswordLogin(email, password) {
    const res = await fetch(`${APP_CONFIG.supabaseUrl}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: APP_CONFIG.supabaseAnonKey
      },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) throw new Error("Supabase login failed");
    return res.json();
  }

  async function backendAuthLogin(email, password) {
    const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      throw new Error(data.error || "invalid_credentials");
    }
    return res.json();
  }

  function persistSession(payload, selectedStore) {
    const expiresAtMs = Date.now() + (Number(payload.expires_in || 900) * 1000);
    localStorage.setItem(AUTH_KEYS.access, payload.access_token || "");
    localStorage.setItem(AUTH_KEYS.refresh, payload.refresh_token || "");
    localStorage.setItem(AUTH_KEYS.expiresAt, String(expiresAtMs));
    localStorage.setItem(AUTH_KEYS.email, payload.user?.email || "");
    localStorage.setItem(AUTH_KEYS.role, payload.user?.role || "manager");
    localStorage.setItem(AUTH_KEYS.sessionStart, String(Date.now()));
    localStorage.setItem("onecounter_store_id", selectedStore);
    localStorage.setItem("onecounter_role", payload.user?.role || "manager");
  }

  (function boot() {
    const existing = localStorage.getItem(AUTH_KEYS.access) || "";
    if (existing) {
      window.location.replace("index.html");
      return;
    }
    if (new URLSearchParams(location.search).get("reason") === "deactivated") {
      document.getElementById("error").textContent = "Account is Deactivated, please contact admin";
    }
  })();

  function clearLoginSession() {
    Object.values(AUTH_KEYS).forEach((k) => localStorage.removeItem(k));
    localStorage.removeItem("onecounter_store_id");
    localStorage.removeItem("onecounter_role");
  }

  // Deactivated tenants get a valid Supabase token but must be blocked from the app.
  async function isTenantActive(accessToken) {
    try {
      const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/me`, {
        headers: {
          Authorization: `Bearer ${accessToken}`,
          "X-Business-Id": window.__ONECOUNTER_BUSINESS_ID__ || "business-main",
          "X-Store-Id": window.__ONECOUNTER_STORE_ID__ || "store-main"
        }
      });
      if (res.status === 403) {
        const data = await res.json().catch(() => ({}));
        if (data.error === "business_inactive") return false;
      }
      return true;
    } catch (_) {
      return true;
    }
  }

  // Load the stores that belong to the entered email's business.
  let storesLoadedFor = "";
  let storesTimer = null;
  async function loadStoresForEmail() {
    const email = document.getElementById("email").value.trim().toLowerCase();
    const sel = document.getElementById("store");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || email === storesLoadedFor) return;
    try {
      const res = await fetch(`${APP_CONFIG.apiBaseUrl}/v1/auth/stores?email=${encodeURIComponent(email)}`);
      const data = await res.json();
      const items = (data && data.items) || [];
      if (items.length) {
        sel.innerHTML = items.map((s) => `<option value="${String(s.code).replace(/"/g, "&quot;")}">${String(s.name).replace(/</g, "&lt;")}</option>`).join("");
        if (data.default_store_code) sel.value = data.default_store_code;
        storesLoadedFor = email;
      } else {
        sel.innerHTML = `<option value="">No stores found for this email</option>`;
      }
    } catch (_) { /* keep placeholder */ }
  }
  document.getElementById("email").addEventListener("change", loadStoresForEmail);
  document.getElementById("email").addEventListener("blur", loadStoresForEmail);
  document.getElementById("email").addEventListener("input", () => { clearTimeout(storesTimer); storesTimer = setTimeout(loadStoresForEmail, 600); });

  document.getElementById("login-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const store = document.getElementById("store").value;
    const errorEl = document.getElementById("error");
    const submitBtn = document.getElementById("submit-btn");

    errorEl.textContent = "";
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    try {
      const payload = isSupabaseConfigured()
        ? await supabasePasswordLogin(email, password)
        : await backendAuthLogin(email, password);
      if (!payload.user) payload.user = { email: email, role: "manager" };
      persistSession(payload, store);
      if (!(await isTenantActive(payload.access_token))) {
        clearLoginSession();
        errorEl.textContent = "Account is Deactivated, please contact admin";
        return;
      }
      window.location.replace("index.html");
    } catch (err) {
      errorEl.textContent = err.message === "invalid_credentials"
        ? "Invalid email or password."
        : "Sign in failed. Check configuration and credentials.";
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = "Sign In";
    }
  });

  // ---- Contact admin via WhatsApp ----
  (function setupContactAdmin() {
    const link = document.getElementById("contact-admin");
    if (!link) return;
    const number = String(window.__ONECOUNTER_ADMIN_WHATSAPP__ || "").replace(/\D/g, "");
    const foot = link.closest(".foot");
    if (!number) {
      // No admin number configured — hide the link entirely.
      if (foot) foot.style.display = "none";
      return;
    }
    function openWhatsApp() {
      const email = (document.getElementById("email").value || "").trim();
      const msg = `Hello Admin, I need help signing in to OneCounter.${email ? "\nMy email: " + email : ""}`;
      const url = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;
      window.open(url, "_blank", "noopener");
    }
    link.addEventListener("click", openWhatsApp);
    link.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openWhatsApp(); }
    });
  })();

  OneCounterPWA.init();
</script>
</body>
</html>
